version: '3.8'

services:
  # 1. VERİTABANI (PostgreSQL) — Sadece iç ağda erişilebilir
  db:
    image: postgres:16-alpine
    container_name: istakip_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: IsTakipDb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. BACKEND API (.NET) — Sadece iç ağda erişilebilir
  api:
    build: ./IsTakip.API
    container_name: istakip_api
    restart: on-failure
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=IsTakipDb;Username=postgres;Password=${DB_PASSWORD}"
      ASPNETCORE_URLS: "http://+:8080"
    expose:
      - "8080"

  # 3. FRONTEND (React + Nginx Reverse Proxy) — Tek public port
  ui:
    build: ./IsTakip.UI
    container_name: istakip_ui
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data: